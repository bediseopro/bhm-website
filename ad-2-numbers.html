<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ad creative 2 — three numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#0E5C43;
    --amber:#E8A13C;
    --paper:#FAFAF7;
    --ink:#111A15;
    --display:"Bricolage Grotesque",Georgia,serif;
    --body:"Inter",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#555;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--body);}

  /* 1080 x 1350 — Meta feed portrait */
  .ad{width:1080px;height:1350px;background:var(--paper);position:relative;overflow:hidden;
      display:flex;flex-direction:column;padding:72px 76px 68px;}

  .top{display:flex;align-items:center;gap:18px;}
  .mark{width:56px;height:56px;border-radius:15px;object-fit:cover;display:block;}
  .brand{font-family:var(--display);font-weight:800;font-size:27px;color:var(--ink);letter-spacing:-.3px;}

  .stack{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;}
  .num{display:flex;align-items:baseline;gap:30px;}
  .num .v{font-family:var(--mono);font-weight:600;font-size:150px;line-height:.94;
          letter-spacing:-7px;color:var(--pine);min-width:390px;}
  .num .k{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.12;
          letter-spacing:-.7px;color:var(--ink);max-width:8.2em;}
  .rule{height:2px;background:#DCE4DE;margin:10px 0;}

  .kicker{margin-top:44px;font-family:var(--display);font-weight:800;font-size:46px;
          line-height:1.1;letter-spacing:-1.4px;color:var(--ink);max-width:17em;}
  .kicker em{font-style:normal;color:var(--pine);}
  .sub{margin-top:20px;font-family:var(--mono);font-size:23px;color:#5C6B63;letter-spacing:.02em;}

  .bar{position:absolute;left:0;right:0;bottom:0;height:14px;background:var(--amber);}
</style>
</head>
<body>

<div class="ad">
  <div class="top">
    <img class="mark" src="app-icon-1200.png" alt="">
    <span class="brand">Pulse SEO</span>
  </div>

  <div class="stack">
    <div class="num"><span class="v">295</span><span class="k">broken links</span></div>
    <div class="rule"></div>
    <div class="num"><span class="v">575</span><span class="k">images with no alt text</span></div>
    <div class="rule"></div>
    <div class="num"><span class="v">202</span><span class="k">missing meta descriptions</span></div>
  </div>

  <p class="kicker">That's <em>one</em> Shopify blog.<br>The owner had no idea.</p>
  <p class="sub">Scan yours free — results in minutes.</p>

  <div class="bar"></div>
</div>

</body>
</html>
